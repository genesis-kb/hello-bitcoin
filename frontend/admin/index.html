<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Programming Bitcoin OJ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="min-h-full bg-zinc-950 text-zinc-100 font-sans antialiased">
  <nav class="sticky top-0 z-50 border-b border-zinc-800/80 bg-zinc-950/90 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
      <a href="/index.html" class="flex items-center gap-2.5 font-bold text-zinc-100 no-underline hover:no-underline shrink-0">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-amber-500/15 text-amber-400 text-base border border-amber-500/30">₿</span>
        <span><span class="text-amber-400">BTC</span>-OJ</span>
      </a>
      <div class="flex items-center gap-6" id="nav-links"></div>
      <div id="nav-user" class="shrink-0"></div>
    </div>
  </nav>

  <div class="border-b border-amber-500/20 bg-amber-500/5">
    <div class="max-w-6xl mx-auto px-4 py-2 flex items-center gap-3">
      <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-amber-500 text-zinc-950">Admin</span>
      <span class="text-sm text-zinc-400">Dashboard</span>
      <a href="/admin/users.html" class="ml-auto text-xs text-zinc-500 hover:text-amber-400 no-underline">Users →</a>
    </div>
  </div>

  <main class="max-w-6xl mx-auto px-4 py-8 pb-16">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="stats-grid">
      <div class="rounded-xl border border-zinc-800 bg-zinc-900/40 p-5 text-center"><span class="spinner"></span></div>
      <div class="rounded-xl border border-zinc-800 bg-zinc-900/40 p-5"></div>
      <div class="rounded-xl border border-zinc-800 bg-zinc-900/40 p-5"></div>
      <div class="rounded-xl border border-zinc-800 bg-zinc-900/40 p-5"></div>
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
      <h2 class="text-lg font-semibold text-zinc-200">Problems</h2>
      <a href="/admin/problem_edit.html"
         class="inline-flex items-center px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-sm font-semibold no-underline transition shadow-lg shadow-amber-500/20">
        + New Problem
      </a>
    </div>
    <div class="rounded-xl border border-zinc-800 bg-zinc-900/40 overflow-hidden mb-8">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-zinc-800 text-left">
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">ID</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Title</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Ch.</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Tests</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Status</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Actions</th>
            </tr>
          </thead>
          <tbody id="problems-body" class="divide-y divide-zinc-800/80">
            <tr><td colspan="6" class="px-4 py-10 text-center text-zinc-500"><span class="spinner"></span></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-4">
      <div>
        <h2 class="text-lg font-semibold text-zinc-200">Recent Submissions</h2>
        <p class="text-xs text-zinc-500 mt-0.5">Latest 50</p>
      </div>
      <a href="/admin/submissions.html"
         class="inline-flex items-center px-3 py-1.5 rounded-lg border border-zinc-700 text-sm text-zinc-300 hover:border-amber-500/40 hover:text-amber-400 no-underline transition">
        View All →
      </a>
    </div>
    <div class="rounded-xl border border-zinc-800 bg-zinc-900/40 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-zinc-800 text-left">
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">#</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">User</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Problem</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Language</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Verdict</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Score</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Time</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Submitted</th>
            </tr>
          </thead>
          <tbody id="subs-body" class="divide-y divide-zinc-800/80">
            <tr><td colspan="8" class="px-4 py-10 text-center text-zinc-500"><span class="spinner"></span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    async function init() {
      await renderNav('admin');
      requireAdmin();

      const [statsRes, problemsRes, subsRes] = await Promise.all([
        apiGet('/admin/stats'),
        apiGet('/admin/problems'),
        apiGet('/admin/submissions'),
      ]);

      const stats    = statsRes.ok    ? await statsRes.json()    : {};
      const problems = problemsRes.ok ? await problemsRes.json() : [];
      const subs     = subsRes.ok     ? await subsRes.json()     : [];

      renderStats(stats);
      renderProblems(problems);
      renderSubs(subs);
    }

    function renderStats(s) {
      const items = [
        { n: s.problems_total, l: 'Total Problems' },
        { n: s.problems_published, l: 'Published' },
        { n: s.submissions_total, l: 'Submissions' },
        { n: s.users_total, l: 'Users' },
      ];
      document.getElementById('stats-grid').innerHTML = items.map(i => `
        <div class="rounded-xl border border-zinc-800 bg-zinc-900/40 p-5 text-center">
          <div class="text-3xl font-bold text-amber-400 tabular-nums">${i.n ?? '—'}</div>
          <div class="text-xs font-semibold uppercase tracking-wider text-zinc-500 mt-1">${i.l}</div>
        </div>
      `).join('');
    }

    function renderProblems(problems) {
      const tbody = document.getElementById('problems-body');
      if (!problems.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-4 py-12 text-center text-zinc-500">
          No problems yet. <a href="/admin/problem_edit.html" class="text-amber-400 no-underline">Create one</a>.</td></tr>`;
        return;
      }
      tbody.innerHTML = problems.map(p => `
        <tr class="hover:bg-zinc-800/30 transition-colors">
          <td class="px-4 py-3 font-mono text-xs text-zinc-500">${escHtml(p.id)}</td>
          <td class="px-4 py-3"><a href="/problem.html?id=${p.id}" class="text-zinc-100 hover:text-amber-400 no-underline">${escHtml(p.title)}</a></td>
          <td class="px-4 py-3 text-zinc-500">${p.chapter}</td>
          <td class="px-4 py-3 text-zinc-600 text-xs">—</td>
          <td class="px-4 py-3">
            ${p.is_published
              ? '<span class="inline-flex px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-400">Published</span>'
              : '<span class="inline-flex px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-zinc-700/40 text-zinc-400">Draft</span>'}
          </td>
          <td class="px-4 py-3">
            <div class="flex flex-wrap gap-2">
              <a href="/admin/problem_edit.html?id=${p.id}"
                 class="px-2 py-1 rounded border border-zinc-700 text-xs text-zinc-400 hover:text-zinc-200 no-underline">Edit</a>
              <button type="button" onclick="deleteProblem('${p.id}')"
                class="px-2 py-1 rounded bg-red-500/15 text-red-400 text-xs hover:bg-red-500/25 border border-red-500/30 cursor-pointer">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function renderSubs(subs) {
      const tbody = document.getElementById('subs-body');
      if (!subs.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="px-4 py-12 text-center text-zinc-500">No submissions yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = subs.map(s => `
        <tr class="hover:bg-zinc-800/30 transition-colors">
          <td class="px-4 py-3"><a href="/submission.html?id=${s.id}" target="_blank" class="font-mono text-xs font-medium text-zinc-200 hover:text-amber-400 no-underline">#${s.id}</a></td>
          <td class="px-4 py-3 text-xs">${s.user_id}</td>
          <td class="px-4 py-3"><a href="/problem.html?id=${s.problem_id}" class="text-xs text-amber-400/90 no-underline">${s.problem_id}</a></td>
          <td class="px-4 py-3 font-mono text-xs text-zinc-500">${s.language}</td>
          <td class="px-4 py-3">${verdictBadge(s.verdict, s.status)}</td>
          <td class="px-4 py-3 text-xs tabular-nums">${s.status === 'DONE' ? `${s.cases_passed}/${s.cases_total}` : '—'}</td>
          <td class="px-4 py-3 text-xs text-zinc-500">${s.time_ms ? s.time_ms+'ms' : '—'}</td>
          <td class="px-4 py-3 text-xs text-zinc-500">${fmtDate(s.created_at)}</td>
        </tr>
      `).join('');
    }

    window.deleteProblem = async function(id) {
      if (!confirm(`Delete problem "${id}"? This cannot be undone.`)) return;
      const res = await apiDelete(`/admin/problems/${id}`);
      if (res.ok || res.status === 204) location.reload();
      else alert('Delete failed: ' + (await res.text()));
    };

    init();
  </script>
</body>
</html>
