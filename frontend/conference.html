<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conference — Hello Bitcoin</title>
  <meta name="description" content="Solve coding exercises for this conference.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="min-h-full bg-zinc-950 text-zinc-100 font-sans antialiased">
  <nav class="sticky top-0 z-50 border-b border-zinc-800/80 bg-zinc-950/90 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-4">
      <a href="/index.html"
        class="flex items-center gap-2.5 font-bold text-zinc-100 no-underline hover:no-underline shrink-0">
        <span
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-amber-500/15 text-amber-400 text-base border border-amber-500/30">₿</span>
        <span><span class="text-amber-400">Hello</span> Bitcoin</span>
      </a>
      <div class="flex items-center gap-6" id="nav-links"></div>
      <div id="nav-user" class="shrink-0"></div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8 pb-16">
    <div class="mb-4">
      <a href="/conferences.html" class="text-sm text-zinc-400 hover:text-amber-400 transition">&larr; Back to
        Conferences</a>
    </div>

    <header class="mb-8">
      <p class="text-xs font-semibold uppercase tracking-widest text-amber-500/90 mb-2" id="conf-year"></p>
      <h1 class="text-2xl sm:text-3xl font-bold text-zinc-50 tracking-tight" id="conf-title">Loading...</h1>
      <p class="mt-2 text-zinc-400 text-sm sm:text-base max-w-2xl" id="conf-desc"></p>
    </header>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
      <h2 class="text-lg font-semibold text-zinc-200">Problems</h2>
    </div>

    <div class="rounded-xl border border-zinc-800 bg-zinc-900/40 shadow-xl shadow-black/20 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b border-zinc-800 text-left">
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500 w-12">#</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Title</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Time</th>
              <th class="px-4 py-3 text-xs font-semibold uppercase tracking-wider text-zinc-500">Status</th>
            </tr>
          </thead>
          <tbody id="problems-body" class="divide-y divide-zinc-800/80">
            <tr>
              <td colspan="4" class="px-4 py-12 text-center text-zinc-500">
                <span class="spinner"></span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/app.js?v=2"></script>
  <script>
    let allProblems = [];
    let mySubmissions = {};
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    async function init() {
      await renderNav('conferences');

      if (!slug) {
        document.getElementById('conf-title').textContent = "Conference Not Found";
        renderProblems([]);
        return;
      }

      const confRes = await apiGet(`/conferences/${slug}`);
      if (!confRes.ok) {
        document.getElementById('conf-title').textContent = "Conference Not Found";
        renderProblems([]);
        return;
      }
      
      const conf = await confRes.json();
      document.getElementById('conf-title').textContent = conf.name;
      document.getElementById('conf-year').textContent = conf.year ? `Year: ${conf.year}` : 'Conference';
      document.getElementById('conf-desc').textContent = conf.description || '';
      document.title = `${conf.name} — Hello Bitcoin`;

      const probRes = await apiGet(`/conferences/${slug}/problems`);
      if (probRes.ok) {
        allProblems = await probRes.json();
      }

      if (Auth.isLoggedIn()) {
        const sr = await apiGet('/submissions/my');
        if (sr.ok) {
          const subs = await sr.json();
          for (const s of subs) {
            if (!mySubmissions[s.problem_id] || s.verdict === 'AC') {
              mySubmissions[s.problem_id] = s.verdict || s.status;
            }
          }
        }
      }

      renderProblems(allProblems);
    }

    function statusBadge(problemId) {
      const v = mySubmissions[problemId];
      if (!v) return '<span class="text-zinc-600">—</span>';
      if (v === 'AC') return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-400">Solved</span>';
      return '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-zinc-700/40 text-zinc-400">Attempted</span>';
    }

    function renderProblems(problems) {
      const tbody = document.getElementById('problems-body');
      if (!problems.length) {
        tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-16 text-center">
          <div class="text-4xl mb-3 opacity-60">📭</div>
          <p class="text-zinc-500">No problems found.</p></td></tr>`;
        return;
      }
      tbody.innerHTML = problems.map((p, i) => `
        <tr class="hover:bg-zinc-800/30 cursor-pointer transition-colors" onclick="location.href='/problem.html?id=${p.id}'">
          <td class="px-4 py-3 text-zinc-500 tabular-nums">${i + 1}</td>
          <td class="px-4 py-3">
            <a href="/problem.html?id=${p.id}" onclick="event.stopPropagation()"
               class="font-medium text-zinc-100 hover:text-amber-400 no-underline transition-colors">${escHtml(p.title)}</a>
          </td>
          <td class="px-4 py-3 text-zinc-500 tabular-nums">${p.time_limit}s</td>
          <td class="px-4 py-3">${statusBadge(p.id)}</td>
        </tr>
      `).join('');
    }

    init();
  </script>
</body>

</html>
